<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divinium Joalheria | Atualização Segura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0d0c0b;
            color: #d4ba88;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 580px;
            background: rgba(26, 24, 22, 0.7);
            border: 1px solid rgba(212, 186, 136, 0.25);
            border-radius: 16px;
            padding: 48px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }
        .brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: #d4ba88;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .sparkle {
            color: #d4ba88;
            font-size: 1.4rem;
            margin-bottom: 12px;
            display: block;
        }
        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        p {
            color: #a8a29e;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 300;
        }
        .btn-reload {
            display: inline-block;
            background: #d4ba88;
            color: #0d0c0b;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 12px 32px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(212, 186, 136, 0.25);
        }
        .btn-reload:hover {
            background: #e6ce9f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 186, 136, 0.4);
        }
        .footer-note {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #78716c;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="sparkle">✦</span>
        <div class="brand">DIVINIUM</div>
        <h1>Serviço Temporariamente em Atualização</h1>
        <p>Estamos concluindo uma atualização segura dos serviços da boutique. Por favor, recarregue a página para continuar sua navegação.</p>
        <a href="/" class="btn-reload" onclick="window.location.reload(); return false;">Recarregar Página</a>
        <div class="footer-note">Alta Joalheria Autoral • Quiet Luxury</div>
    </div>
</body>
</html>
