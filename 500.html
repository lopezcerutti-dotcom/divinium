<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divinium Joalheria | Atualização dos Serviços</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20261029b">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png?v=20261029b">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png?v=20261029b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #F8F8F7;
            color: #202020;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 580px;
            background: #FFFFFF;
            border: 1px solid #737B85;
            border-radius: 16px;
            padding: 48px 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .brand {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 2.2rem;
            letter-spacing: 6px;
            color: #202020;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .sparkle {
            color: #A7ADB4;
            font-size: 1.4rem;
            margin-bottom: 12px;
            display: block;
        }
        h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.6rem;
            font-weight: 400;
            color: #202020;
            margin-bottom: 16px;
            letter-spacing: 1px;
        }
        p {
            color: #686868;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
            font-weight: 400;
        }
        .btn-reload {
            display: inline-block;
            background: linear-gradient(135deg, #CBD0D6 0%, #A7ADB4 100%);
            color: #202020;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 13px 32px;
            border-radius: 30px;
            border: 1px solid #737B85;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(115, 123, 133, 0.2);
        }
        .btn-reload:hover {
            filter: brightness(0.95);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(115, 123, 133, 0.3);
        }
        .footer-note {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #686868;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="sparkle">✦</span>
        <div class="brand">DIVINIUM</div>
        <h1>Serviço em Atualização Segura</h1>
        <p>Estamos concluindo uma atualização segura dos serviços da boutique. Por favor, recarregue a página para continuar sua navegação.</p>
        <a href="/" class="btn-reload" onclick="window.location.reload(); return false;">Recarregar Página</a>
        <div class="footer-note">Alta Joalheria Autoral • Quiet Luxury</div>
    </div>
</body>
</html>
