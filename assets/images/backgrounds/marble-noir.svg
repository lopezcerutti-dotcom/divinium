<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="grad-base" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#252525"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#121212"/>
    </radialGradient>
    <linearGradient id="silver-vein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(167,173,180,0.22)"/>
      <stop offset="50%" stop-color="rgba(203,208,214,0.42)"/>
      <stop offset="100%" stop-color="rgba(115,123,133,0.18)"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="4" result="warp"/>
      <feDisplacementMap xChannelSelector="R" yChannelSelector="G" scale="35" in="SourceGraphic" in2="warp"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad-base)"/>
  <g filter="url(#noise)" opacity="0.65">
    <path d="M-100,150 Q200,300 450,180 T900,450" fill="none" stroke="url(#silver-vein)" stroke-width="3" opacity="0.75"/>
    <path d="M-50,600 Q300,400 550,620 T950,200" fill="none" stroke="url(#silver-vein)" stroke-width="2" opacity="0.55"/>
    <path d="M100,-100 Q400,250 350,550 T500,900" fill="none" stroke="url(#silver-vein)" stroke-width="1.8" opacity="0.6"/>
    <path d="M600,-50 Q700,350 400,600 T200,950" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  </g>
</svg>
